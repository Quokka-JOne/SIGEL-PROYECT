name: CI / QA Quality Gate

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    name: Backend Tests & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jinstock_ci
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: jinstock_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      JWT_SECRET: super-secret-jwt-key-for-github-actions-testing-32chars
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://jinstock_ci:ci_password_123@localhost:5432/jinstock_ci_db?sslmode=disable
      DIRECT_URL: postgresql://jinstock_ci:ci_password_123@localhost:5432/jinstock_ci_db?sslmode=disable
      TEST_DATABASE_URL: postgresql://jinstock_ci:ci_password_123@localhost:5432/jinstock_ci_db?sslmode=disable

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: ./backend
        run: npm ci

      - name: Generar cliente Prisma y aplicar Schema en PostgreSQL
        working-directory: ./backend
        run: |
          npx prisma generate
          npx prisma db push

      - name: Verificar tipos TypeScript (tsc --noEmit)
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Ejecutar pruebas unitarias y de concurrencia real (Vitest)
        working-directory: ./backend
        run: npm test

      - name: Compilar backend para producción (npm run build)
        working-directory: ./backend
        run: npm run build

  frontend-qa:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    env:
      VITE_API_URL: https://jinstock-proyect.onrender.com/api

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compilar aplicación React + Vite PWA (npm run build)
        working-directory: ./frontend
        run: npm run build

      - name: Verificar presencia de cabeceras de seguridad Cloudflare Pages
        run: |
          test -f frontend/dist/_headers
          grep -q "Content-Security-Policy" frontend/dist/_headers
          grep -q "X-Frame-Options: DENY" frontend/dist/_headers
          echo "✅ Cabeceras de seguridad validadas en dist/_headers"
