name: CI / QA Quality Gate

on:
  push:
    branches: [main, 'fix/**', 'final-quality-100']
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    name: Backend Tests, Integration & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: jinstock_ci
          POSTGRES_PASSWORD: ci_password_123
          POSTGRES_DB: jinstock_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 4000
      JWT_SECRET: super-secret-jwt-key-for-github-actions-testing-32chars
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://jinstock_ci:ci_password_123@localhost:5432/jinstock_ci_db?sslmode=disable
      DIRECT_URL: postgresql://jinstock_ci:ci_password_123@localhost:5432/jinstock_ci_db?sslmode=disable
      TEST_DATABASE_URL: postgresql://jinstock_ci:ci_password_123@localhost:5432/jinstock_ci_db?sslmode=disable
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci
      - name: Generar cliente Prisma y aplicar schema
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push
      - name: Verificar tipos TypeScript
        working-directory: backend
        run: npx tsc --noEmit
      - name: Ejecutar pruebas unitarias e integración real
        working-directory: backend
        run: npm test
      - name: Compilar backend para producción
        working-directory: backend
        run: npm run build

  frontend-qa:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://jinstock-proyect.onrender.com/api
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci
      - name: Ejecutar lint
        working-directory: frontend
        run: npm run lint
      - name: Verificar tipos TypeScript
        working-directory: frontend
        run: npx tsc -b
      - name: Compilar aplicación React + Vite PWA
        working-directory: frontend
        run: npm run build
      - name: Verificar cabeceras de seguridad Cloudflare Pages
        run: |
          test -f frontend/dist/_headers
          grep -q "Content-Security-Policy" frontend/dist/_headers
          grep -q "X-Frame-Options: DENY" frontend/dist/_headers
          if grep -Eq "script-src[^;]*'unsafe-inline'" frontend/dist/_headers; then
            echo "::error::La CSP de producción no debe permitir scripts inline"
            exit 1
          fi
          if grep -Eq "connect-src[^;]*http://localhost(:[0-9]+)?" frontend/dist/_headers; then
            echo "::error::La CSP de producción no debe autorizar localhost"
            exit 1
          fi
          grep -Eq "connect-src[^;]*https://jinstock-proyect.onrender.com" frontend/dist/_headers
